similarity_matching:
  # Batch processing settings for raw matches
  sentences:
    batch_size: 1000
    top_n: 5
  keywords:
    batch_size: 1000
    top_n: 10
  projects:
    batch_size: 1000
    top_n: 50

  sentence_matches:
    min_score_quantile: 0.75  # Filter out bottom X% of scores

  # Score combination weights
  score_weights:
    sentence_weight: 0.66  # Weight for document-based matches
    keyword_weight: 0.33  # Weight for keyword-based matches 

  similarity_quantile_threshold: 0.8  # Filter out bottom X% of scores

  # Confidence binning parameters
  binning:
    global_q2_threshold: 0.50    # Global threshold for medium confidence
    global_q3_threshold: 0.75    # Global threshold for high confidence
    local_q2_threshold: 0.50     # Project-level threshold for medium confidence
    local_q3_threshold: 0.75     # Project-level threshold for high confidence

  # Global pruning threshold
  global_embedding_threshold: 0.75  # Remove bottom 75% of matches by similarity score