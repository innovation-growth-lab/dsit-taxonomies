similarity_matching:
  # Batch processing settings for raw matches
  sentences:
    batch_size: 1000
    top_n: 5
  keywords:
    batch_size: 1000
    top_n: 10
  projects:
    batch_size: 1000
    top_n: 50

  sentence_matches:
    min_score_quantile: 0.75  # Filter out bottom X% of scores

  # Score combination weights
  score_weights:
    sentence_weight: 0.66  # Weight for sentence-based matches (alpha)
    global_weight: 0.20    # Weight for global matches (beta)
    # Remaining 0.14 goes to keyword matches (1-alpha-beta)

  similarity_quantile_threshold: 0.8  # Filter out bottom X% of scores

  normalise_by_matches: True

  # Confidence binning parameters
  binning:
    global_q2: 0.50    # Global threshold for medium confidence
    global_q3: 0.75    # Global threshold for high confidence
    local_q2: 0.50     # Project-level threshold for medium confidence
    local_q3: 0.75     # Project-level threshold for high confidence

  # Global pruning threshold
  pruning:
    use_quantile: True
    sentence_threshold: 0.75
    global_threshold: 0.75
    keyword_threshold: 0.75

  # Zero-shot validation settings  
  zeroshot:
    model_name: "tasksource/ModernBERT-large-nli"
    batch_size: 32