batch_size: 1000
top_n: 10
number_returns: 2000

similarity_matching:
  # Batch processing settings for raw matches
  batch_size: 1000
  top_n: 10
  number_returns: 2000

  sentence_matches:
    top_k_per_sentence: 3  # Number of top matches to keep per document
    min_score_quantile: 0.25  # Filter out bottom X% of scores
    min_similarity_score: 0.5  # Minimum similarity score for normalisation

  # Score combination weights
  score_weights:
    sentence_weight: 1  # Weight for document-based matches
    keyword_weight: 1  # Weight for keyword-based matches 