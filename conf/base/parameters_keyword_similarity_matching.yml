batch_size: 1000
top_n: 10
number_returns: 2000

similarity_matching:
  # Batch processing settings for raw matches
  batch_size: 1000
  top_n: 10
  number_returns: 2000

  sentence_matches:
    top_k_per_sentence: 4  # Number of top matches to keep per document
    min_score_quantile: 0.8  # Filter out bottom X% of scores

  # Score combination weights
  score_weights:
    sentence_weight: 0.66  # Weight for document-based matches
    keyword_weight: 0.33  # Weight for keyword-based matches 

  similarity_quantile_threshold: 0.8  # Filter out bottom X% of scores