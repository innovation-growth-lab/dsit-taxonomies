# Here you can define all your data sets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

# -> 0. Global catalog variables:
_pq: &_pq
  type: pandas.ParquetDataset
  credentials: s3_credentials
  filepath: None
  load_args:
    engine: pyarrow

_xlsx: &_xlsx
  type: pandas.ExcelDataset
  credentials: s3_credentials
  filepath: None

_pq_ptd: &_pq_ptd
  type: partitions.PartitionedDataset
  dataset:
    type: pandas.ParquetDataset
    save_args:
      engine: pyarrow
    load_args:
      engine: pyarrow
  filename_suffix: ".parquet"
  credentials: s3_credentials

_js_ptd: &_js_ptd
  type: partitions.PartitionedDataset
  dataset: json.JSONDataset
  filename_suffix: ".json"
  credentials: s3_credentials

# -> 1a. GTR Data Collection:
gtr.data_collection.projects.raw:
  <<: *_js_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/01_raw/gtr/projects/

gtr.data_collection.projects.intermediate: &gtr_input_projects
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/main.parquet

gtr.projects.documents:
  <<: *gtr_input_projects
  load_args:
    columns:
      - project_id
      - title
      - abstract_text
      - tech_abstract_text
      - potential_impact

projects.gtr_data.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/global/main.parquet

sentences.gtr_data.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/sentences/main.parquet

# -> 1b. Taxonomies
taxonomy.cwts.raw:
  <<: *_xlsx
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/cwts_oa_topics.xlsx

taxonomy.cwts.full.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/cwts_oa_topics.parquet

taxonomy.cwts.bottom.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/cwts_oa_topics_bottom_level.parquet

taxonomy.goscience.raw:
  <<: *_xlsx
  load_args:
    skiprows: 2
    names:
      - taxonomy_level
      - parent_name
      - concept_name
      - related_concepts
      - definition_scope_note
      - examples
      - collection_membership
      - enabled_by
      - applications
      - field_of_research
      - alternative_labels
      - hidden_labels
      - search_terms
      - extra_column_1
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/go_science_topics.xlsx

taxonomy.goscience.full.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/go_science_topics.parquet

taxonomy.goscience.bottom.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/go_science_topics_bottom_level.parquet

taxonomy.oa_concepts.raw:
  <<: *_xlsx
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/oa_concepts.xlsx

taxonomy.oa_concepts.full.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/oa_concepts.parquet

taxonomy.oa_concepts.bottom.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/oa_concepts_bottom_level.parquet

# -> 2. GTR Data Annotations:
dbp.gtr_data.annotated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/dbp.parquet

rake.gtr_data.annotated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/rake.parquet

yake.gtr_data.annotated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/yake.parquet

keybert.gtr_data.annotated.ptd:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/keybert/

keybert.gtr_data.annotated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/keybert.parquet

# -> 3. GTR Processed Annotations:
keywords.gtr_data.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/keywords/preprocessed.parquet

keywords.gtr_data.embeddings:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/keywords/embeddings.parquet

# -> 4. Taxonomy matching candidates:
"{group}.gtr_data.{taxonomy_name}_matches.raw":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/gtr/projects/{group}/matches/{taxonomy_name}.parquet

"{group}.gtr_data.{taxonomy_name}_matches.intermediate":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/{group}/matches/{taxonomy_name}.parquet

# Pruned matches
"{group}.gtr_data.{taxonomy_name}_matches.pruned":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/{group}/matches/{taxonomy_name}_pruned.parquet

# Granular scores
"projects.gtr_data.{taxonomy_name}_scores.granular":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/scores/{taxonomy_name}_granular.parquet

# Final scores
"projects.gtr_data.{taxonomy_name}_scores.aggregated":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/scores/{taxonomy_name}_aggregated.parquet

# Zero-shot filtered scores
"projects.gtr_data.{taxonomy_name}_scores.zeroshot":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/04_output/gtr/projects/scores/{taxonomy_name}_zeroshot.parquet

# # -> 5. GTR Fine Tuning Data:
gtr.projects.sample:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/projects/sample.parquet

"sample_data.{taxonomy_name}_scores.aggregated":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/projects/sample_scores/{taxonomy_name}_aggregated.parquet

"gtr.projects.sample.expert_labels.{taxonomy_name}":
  <<: *_js_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/05_validation/projects/sample_expert_labels/{taxonomy_name}/

"gtr.projects.sample.expert_assessment.{taxonomy_name}":
  <<: *_js_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/05_validation/projects/sample_expert_assessment/{taxonomy_name}/

# # tuning outputs
"tuning.{taxonomy_name}.expert_labels.processed":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/expert_labels_processed.parquet

"tuning.{taxonomy_name}.expert_assessment.processed":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/expert_assessment_processed.parquet

"tuning.{taxonomy_name}.parameter_tuning_results":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/parameter_tuning_results.parquet

"tuning.{taxonomy_name}.project_results":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/project_results.parquet