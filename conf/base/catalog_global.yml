  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/scores/aggregated/cwts.parquet

projects.gtr_data.goscience_scores.aggregated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/scores/aggregated/goscience.parquet

projects.gtr_data.oa_concepts_scores.aggregated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/scores/aggregated/oa_concepts.parquet

# -> 5. GTR Fine Tuning Data:
gtr.projects.sample:
