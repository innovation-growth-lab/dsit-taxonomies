# Here you can define all your data sets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

# -> 0. Global catalog variables:
_pq: &_pq
  type: pandas.ParquetDataset
  credentials: s3_credentials
  filepath: None
  load_args:
    engine: pyarrow

_xlsx: &_xlsx
  type: pandas.ExcelDataset
  credentials: s3_credentials
  filepath: None

_pq_ptd: &_pq_ptd
  type: partitions.PartitionedDataset
  dataset:
    type: pandas.ParquetDataset
    save_args:
      engine: pyarrow
    load_args:
      engine: pyarrow
  filename_suffix: ".parquet"
  credentials: s3_credentials

_js_ptd: &_js_ptd
  type: partitions.PartitionedDataset
  dataset: json.JSONDataset
  filename_suffix: ".json"
  credentials: s3_credentials

# -> 1a. GTR Data Collection:
gtr.data_collection.projects.raw:
  <<: *_js_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/01_raw/gtr/projects/

gtr.data_collection.projects.intermediate: &gtr_input_projects
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/main.parquet

gtr.projects.documents:
  <<: *gtr_input_projects
  load_args:
    columns:
      - project_id
      - title
      - abstract_text
      - tech_abstract_text
      - potential_impact

sentences.gtr_data.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/sentences/main.parquet

# -> 1b. Taxonomies
taxonomy.cwts.raw:
  <<: *_xlsx
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/cwts_oa_topics.xlsx

taxonomy.cwts.full.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/cwts_oa_topics.parquet

taxonomy.cwts.bottom.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/cwts_oa_topics_bottom_level.parquet

taxonomy.goscience.raw:
  <<: *_xlsx
  load_args:
    skiprows: 2
    names:
      - taxonomy_level
      - parent_name
      - concept_name
      - related_concepts
      - definition_scope_note
      - examples
      - collection_membership
      - enabled_by
      - applications
      - field_of_research
      - alternative_labels
      - hidden_labels
      - search_terms
      - extra_column_1
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/go_science_topics.xlsx

taxonomy.goscience.full.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/go_science_topics.parquet

taxonomy.goscience.bottom.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/go_science_topics_bottom_level.parquet

taxonomy.oa_concepts.raw:
  <<: *_xlsx
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/oa_concepts.xlsx

taxonomy.oa_concepts.full.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/oa_concepts.parquet

taxonomy.oa_concepts.bottom.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/oa_concepts_bottom_level.parquet

# -> 2. GTR Data Annotations:
dbp.gtr_data.annotated:
