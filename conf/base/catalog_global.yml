# Here you can define all your data sets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

# -> 0. Global catalog variables:
_pq: &_pq
  type: pandas.ParquetDataset
  credentials: s3_credentials
  filepath: None
  load_args:
    engine: pyarrow

_xlsx: &_xlsx
  type: pandas.ExcelDataset
  credentials: s3_credentials
  filepath: None

_pq_ptd: &_pq_ptd
  type: partitions.PartitionedDataset
  dataset: 
    type: pandas.ParquetDataset
    save_args:
      engine: pyarrow
    load_args:
      engine: pyarrow
  filename_suffix: '.parquet'
  credentials: s3_credentials

_js_ptd: &_js_ptd
  type: partitions.PartitionedDataset
  dataset: json.JSONDataset
  filename_suffix: ".json"
  credentials: s3_credentials

_hd5: &_hd5
  type: pandas.HDFDataset
  filepath: None
  credentials: s3_credentials
  key: data

# -> 1a. GTR Data Collection:
gtr.data_collection.projects.raw:
  <<: *_js_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/01_raw/gtr/projects/

gtr.data_collection.projects.intermediate: &gtr_input_projects
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/main.parquet

# -> 1b. Taxonomies
taxonomy.cwts.raw:
  <<: *_xlsx
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/cwts_oa_topics.xlsx

taxonomy.go_science.raw:
  <<: *_xlsx
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/go_science_topics.xlsx

# -> 2. GTR Data Annotations:
dbp.gtr_data.annotated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/dbp.parquet

rake.gtr_data.annotated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/rake.parquet

yake.gtr_data.annotated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/yake.parquet

keybert.gtr_data.annotated.ptd:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/keybert/

keybert.gtr_data.annotated:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/keybert.parquet

# -> 3. GTR Processed Annotations:
keywords.gtr_data.preprocessed:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/keywords/preprocessed.parquet

keywords.gtr_data.processed:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/keywords/processed.parquet

keywords.gtr_data.embeddings:
  <<: *_hd5
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/keywords/embeddings.h5