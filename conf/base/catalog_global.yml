# Catalog Entries:

#### Data Collection ####

# 1. GTR Data Collection:
#    - Collection of project data from GTR API.
#    - Pipeline: data_collection_gtr
#     1.1. Raw Projects:
#         - Dataset: gtr.data_collection.projects.raw
#         - Content: JSON data from API
#     1.2. Intermediate Projects:
#         - Dataset: gtr.data_collection.projects.intermediate
#         - Content: Preprocessed project data
#     1.3. Project Documents:
#         - Dataset: gtr.projects.documents
#         - Content: Text fields (title, abstracts, impact)

# #### Taxonomy Processing ####

# 2. Taxonomy Data:
#    - Processing multiple research taxonomies.
#    - Pipeline: data_processing_taxonomies
#     2.1. Raw Taxonomies:
#         - Datasets: 
#             - taxonomy.cwts.raw
#             - taxonomy.goscience.raw
#             - taxonomy.oa_concepts.raw
#         - Content: Original taxonomy structures
#     2.2. Processed Taxonomies:
#         - Datasets:
#             - taxonomy.{taxonomy_name}.full.db
#             - taxonomy.{taxonomy_name}.bottom.db
#         - Content: Standardised hierarchical format

# #### Keyword Processing ####

# 3. Keyword Extraction:
#    - Multiple keyword extraction methods.
#    - Pipeline: data_annotation_gtr
#     3.1. Annotator Results:
#         - Datasets: {annotator}.gtr_data.annotated
#         - Annotators: dbp, rake, yake, keybert
#         - Oracle Datasets: {annotator}.gtr_data.annotated.oracle
#     3.2. KeyBERT Partitions:
#         - Dataset: keybert.gtr_data.annotated.ptd
#         - Content: Partitioned extraction results

# 4. Keyword Processing:
#    - Aggregating and embedding keywords.
#    - Pipeline: keyword_processing_gtr
#     4.1. Processed Keywords:
#         - Dataset: keywords.gtr_data.db
#         - Content: Aggregated, filtered keywords
#     4.2. Keyword Embeddings:
#         - Dataset: keywords.gtr_data.embeddings
#         - Content: Dense vector representations

# #### Similarity Matching ####

# 5. Similarity Scores:
#     5.1. Project Documents:
#         - Dataset: projects.gtr_data.db
#         - Content: Global project texts
#     5.2. Sentence Documents:
#         - Dataset: sentences.gtr_data.db
#         - Content: Split sentences
#    - Computing similarity between projects and taxonomies.
#    - Pipeline: keyword_similarity_matching
#     5.3. Raw Matches:
#         - Datasets: {group}.gtr_data.{taxonomy_name}_matches.raw
#         - Groups: projects, sentences, keywords
#     5.4. Intermediate Matches:
#         - Datasets: {group}.gtr_data.{taxonomy_name}_matches.intermediate
#     5.5. Pruned Matches:
#         - Datasets: {group}.gtr_data.{taxonomy_name}_matches.pruned
#     5.6. Granular Scores:
#         - Dataset: projects.gtr_data.{taxonomy_name}_scores.granular

# 6. Final Scores:
#    - Refined and validated taxonomy assignments.
#    - Pipeline: keyword_similarity_refinement
#     6.1. Aggregated Scores:
#         - Dataset: projects.gtr_data.{taxonomy_name}_scores.aggregated
#     6.2. Zeroshot Scores:
#         - Dataset: projects.gtr_data.{taxonomy_name}_scores.zeroshot 

# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

# import the js_ptd variable

# -> 0. Global catalog variables:
_pq: &_pq
  type: pandas.ParquetDataset
  credentials: s3_credentials
  filepath: None
  load_args:
    engine: pyarrow

_xlsx: &_xlsx
  type: pandas.ExcelDataset
  credentials: s3_credentials
  filepath: None

_pq_ptd: &_pq_ptd
  type: partitions.PartitionedDataset
  dataset:
    type: pandas.ParquetDataset
    save_args:
      engine: pyarrow
    load_args:
      engine: pyarrow
  filename_suffix: ".parquet"
  credentials: s3_credentials

_js_ptd: &_js_ptd
  type: partitions.PartitionedDataset
  dataset: json.JSONDataset
  filename_suffix: ".json"
  credentials: s3_credentials

_dpq: &_dpq
  type: dsit_taxonomy.datasets.defaultable_datasets.DefaultableParquetDataset
  credentials: s3_credentials
  filepath: None
  load_args:
    engine: pyarrow

# -> 1. GTR Data Collection:
gtr.data_collection.projects.raw:
  <<: *_js_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/01_raw/gtr/projects/

gtr.data_collection.projects.intermediate: &gtr_input_projects
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/main.parquet

gtr.projects.documents:
  <<: *gtr_input_projects
  load_args:
    columns:
      - project_id
      - title
      - abstract_text
      - tech_abstract_text
      - potential_impact

projects.gtr_data.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/global/main.parquet

sentences.gtr_data.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/sentences/main.parquet

# -> 2. Taxonomies
taxonomy.cwts.raw:
  <<: *_xlsx
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/cwts.xlsx

taxonomy.goscience.raw:
  <<: *_xlsx
  load_args:
    skiprows: 2
    names:
      - taxonomy_level
      - parent_name
      - concept_name
      - related_concepts
      - definition_scope_note
      - examples
      - collection_membership
      - enabled_by
      - applications
      - field_of_research
      - alternative_labels
      - hidden_labels
      - search_terms
      - extra_column_1
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/goscience.xlsx

taxonomy.oa_concepts.raw:
  <<: *_xlsx
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/taxonomies/oa_concepts.xlsx

"taxonomy.{taxonomy_name}.full.db":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/{taxonomy_name}.parquet

"taxonomy.{taxonomy_name}.bottom.db":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/taxonomies/{taxonomy_name}_bottom_level.parquet

# -> 3. GTR Data Annotations:
"{annotator}.gtr_data.annotated":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/{annotator}.parquet

keybert.gtr_data.annotated.ptd:
  <<: *_pq_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/keybert/

"{annotator}.gtr_data.annotated.oracle":
  <<: *_dpq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/annotations/{annotator}.parquet
  
# -> 4. GTR Processed Annotations:
keywords.gtr_data.db:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/keywords/preprocessed.parquet

keywords.gtr_data.embeddings:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/keywords/embeddings.parquet

# -> 5. Similarity Scores:
"{group}.gtr_data.{taxonomy_name}_matches.raw":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/01_raw/gtr/projects/{group}/matches/{taxonomy_name}.parquet

"{group}.gtr_data.{taxonomy_name}_matches.intermediate":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/{group}/matches/{taxonomy_name}.parquet

# Pruned matches
"{group}.gtr_data.{taxonomy_name}_matches.pruned":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/02_intermediate/gtr/projects/{group}/matches/{taxonomy_name}_pruned.parquet

# Granular scores
"projects.gtr_data.{taxonomy_name}_scores.granular":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/scores/{taxonomy_name}_granular.parquet

# -> 6. Final scores
"projects.gtr_data.{taxonomy_name}_scores.aggregated":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/03_primary/gtr/projects/scores/{taxonomy_name}_aggregated.parquet

"projects.gtr_data.{taxonomy_name}_scores.zeroshot":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/04_output/gtr/projects/scores/{taxonomy_name}_zeroshot.parquet

"projects.gtr_data.{taxonomy_name}_scores.final":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/04_output/gtr/projects/scores/{taxonomy_name}_final.parquet

# # -> 7. Validation Data:
gtr.projects.sample:
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/projects/sample.parquet

"sample_data.{taxonomy_name}_scores.aggregated":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/projects/sample_scores/{taxonomy_name}_aggregated.parquet

"gtr.projects.sample.expert_labels.{taxonomy_name}":
  <<: *_js_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/05_validation/projects/sample_expert_labels/{taxonomy_name}/

"gtr.projects.sample.expert_assessment.{taxonomy_name}":
  <<: *_js_ptd
  path: s3://igl-dsit-impact/01_taxonomies/data/05_validation/projects/sample_expert_assessment/{taxonomy_name}/

# # tuning outputs
"tuning.{taxonomy_name}.expert_labels.processed":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/expert_labels_processed.parquet

"tuning.{taxonomy_name}.expert_assessment.processed":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/expert_assessment_processed.parquet

"tuning.{taxonomy_name}.parameter_tuning_results":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/parameter_tuning_results.parquet

"tuning.{taxonomy_name}.project_results":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/project_results.parquet

"validate.{taxonomy_name}.score_quality_metrics":
  <<: *_pq
  filepath: s3://igl-dsit-impact/01_taxonomies/data/05_validation/{taxonomy_name}/score_quality_metrics.parquet
