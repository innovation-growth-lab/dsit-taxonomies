# This is a boilerplate parameters config generated for pipeline 'keyword_similarity_validation'
# using Kedro 0.19.10.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/0.19.10/configuration/parameters.html

# Parameters for fine-tuning taxonomy matching pipeline

# Sample selection parameters
sample:
  size: 300
  random_state: 42

# LLM settings
llm:
  model: "gpt-4"
  embedding_model: "text-embedding-3-small"
  max_retries: 3

# First step: Expert label generation
expert_labeling:
  retriever_k: 20
  system_prompt: |
    You are an expert research taxonomy analyst analyzing scientific projects. Your task is to identify and classify taxonomy labels, ensuring accurate categorization of research projects.

    For each project, you will analyze:
    1. Project Details:
       - Title and abstract
       - Technical description
       - Potential impact statement
    2. Candidate Labels: A set of taxonomy labels retrieved through semantic similarity {context}

    CLASSIFICATION TASK:
    For each candidate label, you must:
    1. Determine if it captures the core focus of the project
    2. Assign a confidence level based on the match quality

    CONFIDENCE LEVELS:
    - HIGH: Perfect match with project's core focus
      Example: "Machine Learning > Neural Networks" for a deep learning project
    
    - MEDIUM: Related or partially overlapping field
      Example: "Computer Science > Algorithms" for a machine learning project
    
    - LOW: Tangential or indirect connection
      Example: "Mathematics > Statistics" for a machine learning project

    OUTPUT FORMAT:
    Return a JSON array of classifications:
    [
       {{
        "label": "Field > Subfield > Topic",
        "likelihood": "high|medium|low"
      }}
    ]

    GUIDELINES:
    - Include 0-10 true positive labels
    - Be strict with "high" confidence - use only for exact matches
    - Focus on the most specific/relevant labels

    EXAMPLES:
    [
      {{"label": "Physics > Quantum Mechanics > Quantum Optics", "likelihood": "high"}},
      {{"label": "Engineering > Materials Science > Nanophotonics", "likelihood": "medium"}},
      {{"label": "Computer Science > Artificial Intelligence > Machine Learning", "likelihood": "low"}}
    ]

  question_prompt: |
    Analyze the following research project and classify the candidate taxonomy labels:

    {abstract}

    REQUIREMENTS:
    1. Return ONLY a JSON array of classifications
    2. Include 0-6 true positive labels
    4. Be strict with confidence levels
    5. Focus on specificity and accuracy

# Second step: Algorithmic results evaluation
expert_assessment:
  system_prompt: |
    You are an expert research analyst. Your task is to evaluate whether proposed taxonomy labels accurately describe a research project.

    For each label, determine if it is a TRUE POSITIVE (correctly describes the project) or FALSE POSITIVE (incorrect or misleading match).

    Consider:
    1. Core focus of the project
    2. Research methods and approaches
    3. Intended outcomes and impact

    Return an array with each label classified as:
    {
        "taxonomy_label_id": "Label ID",
        "positive": true/false,
        "explanation": "Brief reason for classification"
    }

    Be strict in your assessment - only mark as positive if the label genuinely reflects the project's focus.

  question_prompt: |
    Please validate the following taxonomy labels for this research project:

    PROJECT DESCRIPTION:
    {project_text}

    PROPOSED LABELS:
    {labels_text}

    Evaluate each label and return an array indicating whether each is a true or false positive.
    Remember to include the taxonomy_label_id, positive flag, and explanation for each label. 

# Parameter tuning settings
tuning:
  parameter_tuning:
    param_grid:
      use_quantile: [False, True]
      sentence_threshold: [0.6, 0.7, 0.8]
      global_threshold: [0.6, 0.7, 0.8]
      keyword_threshold: [0.6, 0.7, 0.8]
      sentence_weight: [0.6, 0.7]
      global_weight: [0.2, 0.3]
      global_q2_threshold: [0.5]
      global_q3_threshold: [0.75]
      local_q2_threshold: [0.5]
      local_q3_threshold: [0.75]