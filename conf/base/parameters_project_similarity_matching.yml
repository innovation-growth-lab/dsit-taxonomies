similarity_matching:
  n_jobs: 8
  # Batch processing settings for raw matches
  sentences:
    batch_size: 1000
    top_n: 5
  keywords:
    batch_size: 1000
    top_n: 10
  projects:
    batch_size: 1000
    top_n: 50

  sentence_matches:
    min_score_quantile: 0.75  # Filter out bottom X% of scores

  # Score combination weights
  score_weights:
    sentence_weight: 0.6  # Weight for sentence-based matches (alpha)
    global_weight: 0.3    # Weight for global matches (beta)
    # Remaining 0.1 goes to keyword matches (1-alpha-beta)

  # Global pruning threshold
  pruning:
    use_quantile: True
    sentence_threshold: 0.6
    global_threshold: 0.6
    keyword_threshold: 0.6
